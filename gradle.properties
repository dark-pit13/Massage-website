org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Release signing ---------------------------------------------------------
# Leave these commented out to build an unsigned release, or a debug APK, which
# is signed automatically and installs fine on your own phone.
# To build a signed release, create a keystore (see README-BUILD.md) and fill in:
# APPOINTMENTS_STORE_FILE=/absolute/path/to/appointments-release.jks
# APPOINTMENTS_STORE_PASSWORD=your-keystore-password
# APPOINTMENTS_KEY_ALIAS=appointments
# APPOINTMENTS_KEY_PASSWORD=your-key-password
